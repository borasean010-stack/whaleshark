<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예약하기 | BORACAY WHALE SHARK</title>
<link rel="stylesheet" href="css/style.css"> <!-- for nav -->
<link rel="stylesheet" href="css/reservation.css">
<!-- Flatpickr (Premium Datepicker) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
</head>
<body>


<!-- Header / Nav -->
<header class="site-header" style="position:fixed; width:100%; z-index:50;">
  <div class="container header-inner">
    <a href="index.html" class="logo">🐋 BORACAY WHALE SHARK</a>
    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="index.html#tours">투어 소개</a>
      <a href="reservation.html">예약하기</a>
    </nav>
  </div>
</header>

<!-- Background Video -->
<iframe class="res-bg-video" src="https://www.youtube.com/embed/GnC-jWDaqgY?autoplay=1&mute=1&loop=1&playlist=GnC-jWDaqgY&controls=0&showinfo=0&rel=0&playsinline=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<!-- 투명도(불투명도) 오버레이 -->
<div class="res-overlay"></div>

<!-- Split Layout -->
<div class="res-container">
  
  <!-- Left Column: Branding & Text (Dynamic Content) -->
  <div class="res-text-col">
    <span class="res-badge" id="dyn-badge">RESERVATION EXPERIENCE</span>
    <h1 class="res-title" id="dyn-title">SECURE<br>YOUR TOUR</h1>
    <p class="res-desc" id="dyn-desc">
      프라이빗한 보라카이 고래상어 투어를 지금 바로 예약하세요.
    </p>
  </div>

  <!-- Right Column: Booking Card (Form) -->
  <div class="booking-card">
    <form id="reservation-form">
      
      <!-- Tour Options Selection (Hidden as requested) -->
      <div class="form-group" style="display: none;">
        <label>투어 옵션 선택 *</label>
        <div class="tour-options">
          <label class="tour-option">
            <input type="radio" name="tourType" value="F" checked required>
            <div class="tour-card">
              <h4>패스트트랙</h4>
              <span>95,000원<br><small>올인클루시브 + 패스트트랙</small></span>
            </div>
          </label>
          <label class="tour-option">
            <input type="radio" name="tourType" value="VF" required>
            <div class="tour-card">
              <h4>VIP패스트트랙</h4>
              <span>145,500원<br><small>단독차량 + 수중촬영가</small></span>
            </div>
          </label>
          <label class="tour-option">
            <input type="radio" name="tourType" value="R" required>
            <div class="tour-card">
              <h4>레귤러</h4>
              <span>75,000원<br><small>사우스웨스트 이동 + 기본</small></span>
            </div>
          </label>
          <label class="tour-option">
            <input type="radio" name="tourType" value="T" required>
            <div class="tour-card">
              <h4>티켓온리</h4>
              <span>50,000원<br><small>티켓만 단독 구매</small></span>
            </div>
          </label>
        </div>
        
        <!-- 포함사항 안내 패널 -->
        <div id="tour-inclusions" style="margin-top: 16px; padding: 16px; background: rgba(37, 99, 235, 0.05); border: 1px solid rgba(37, 99, 235, 0.2); border-radius: 12px; font-size: 0.9rem; line-height: 1.6; color: var(--color-fg); display: none;">
          <!-- JS로 내용이 채워집니다 -->
        </div>
      </div>

      <!-- Date Selection -->
      <div class="form-group">
        <label for="date">투어 희망 날짜 *</label>
        <input type="date" id="date" name="date" class="input-luxury" required>
      </div>

      <!-- Guests -->
      <div class="form-group">
        <label for="people">참여 인원 *</label>
        <input type="number" id="people" name="people" class="input-luxury" min="1" max="20" value="2" required>
      </div>

      <!-- Contact Info -->
      <div class="form-group">
        <label for="name">예약자 성함 (영문) *</label>
        <input type="text" id="name" name="name" class="input-luxury" placeholder="HONG GILDONG" required>
      </div>

      <div class="form-group">
        <label for="phone">연락처 또는 카카오톡 ID *</label>
        <input type="text" id="phone" name="phone" class="input-luxury" placeholder="연락 가능한 정보를 남겨주세요" required>
      </div>

      <!-- Note -->
      <div class="form-group">
        <label for="message">픽업 장소 / 특별 요청사항</label>
        <textarea id="message" name="message" class="input-luxury" rows="3" placeholder="호텔명 또는 기타 문의사항을 적어주세요"></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">예약 접수하기</button>
      
      <p id="form-status" class="form-status" role="status"></p>
    </form>
  </div>

</div>

<!-- 동적 텍스트 및 예약 스크립트 -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const requestedTour = urlParams.get('tour');
    const tourParam = urlParams.get('tour'); // 기존 로직 유지용
    
    // 포함사항 데이터
    const inclusionsData = {
      'F': '<b>[패스트트랙 포함사항]</b><br>입장료, 관람료, 환경세, 왕복 차량비용 전부 포함<br>구명조끼, 짐보관, 핀 무료 대여, 생수 제공<br>패스트트랙 (고래상어 대기없이 바로 이용)<br>고래상어 종료 후 호텔 드랍 서비스<br>액션캠 무료 대여<br>점보크랩 이용시 인당 새우 한마리 무료<br>1인 $30 상당 아일랜드투어 무료 제공<br>보라카이션 멤버십 카드 제공',
      'VF': '<b>[VIP 패스트트랙 포함사항]</b><br>입장료, 관람료, 환경세, <b>전용 단독 차량비용</b> 전부 포함<br>구명조끼, 짐보관, 핀, 스노클마스크 무료 대여, 생수 제공<br>패스트트랙 (고래상어 대기없이 바로 이용)<br>고래상어 종료 후 호텔 드랍 서비스<br><b>리버타드 전문 수중촬영가 서비스</b><br>점보크랩 이용시 인당 새우 한마리 무료<br>1인 $30 상당 아일랜드투어 무료 제공<br>보라카이션 멤버십 카드 제공',
      'R': '<b>[레귤러 포함사항]</b><br>사우스웨스트 이동<br>헬퍼, 오리발 포함<br>※ 티켓은 보라카이션 티켓 이용',
      'T': '<b>[티켓 온리 안내]</b><br>입장 티켓만 단독 판매 (1,920페소 / 수수료 감안 50,000원)<br>티켓 수령처: 보라카이션 사무실<br>수령 가능 시간: 오전 8시 ~ 오후 6시'
    };

    const radios = document.querySelectorAll('input[name="tourType"]');
    const inclusionsPanel = document.getElementById('tour-inclusions');

    function updateInclusions() {
      const selectedValue = document.querySelector('input[name="tourType"]:checked').value;
      if (inclusionsData[selectedValue]) {
        inclusionsPanel.innerHTML = inclusionsData[selectedValue];
        inclusionsPanel.style.display = 'block';
      } else {
        inclusionsPanel.style.display = 'none';
      }
    }

    if (requestedTour) {
      const radio = document.querySelector(`input[name="tourType"][value="${requestedTour}"]`);
      if (radio) radio.checked = true;
    }
    
    // 초기 로딩 시 포함사항 업데이트
    updateInclusions();

    // 라디오 버튼 변경 시마다 포함사항 업데이트
    radios.forEach(r => r.addEventListener('change', updateInclusions));

    const badge = document.getElementById('dyn-badge');
    const title = document.getElementById('dyn-title');
    const desc = document.getElementById('dyn-desc');
    const btn = document.getElementById('submit-btn');
    
    // 왼쪽 패널 다이내믹 변경 (옵션)
    function updateLeftPanel() {
      const val = document.querySelector('input[name="tourType"]:checked').value;
      if (val === 'VF') {
        title.innerHTML = 'VIP FAST<br>TRACK';
        desc.innerHTML = '전용 단독차량과 수중촬영가가 동행하는 완벽한 프리미엄 투어입니다.';
        btn.style.background = 'var(--color-primary)';
      } else if (val === 'F') {
        title.innerHTML = 'FAST<br>TRACK';
        desc.innerHTML = '가장 인기 있는 올인클루시브 패키지. 대기 없이 쾌적하게 즐기세요.';
        btn.style.background = 'var(--color-accent)';
      } else if (val === 'R') {
        title.innerHTML = 'REGULAR<br>TOUR';
        desc.innerHTML = '사우스웨스트를 이용하는 기본 충실 고래상어 투어입니다.';
        btn.style.background = 'var(--color-fg)';
      } else if (val === 'T') {
        title.innerHTML = 'TICKET<br>ONLY';
        desc.innerHTML = '보라카이션 사무실에서 입장 티켓만 간편하게 수령하세요.';
        btn.style.background = 'transparent';
        btn.style.color = 'var(--color-fg)';
        btn.style.border = '2px solid var(--color-fg)';
      }
    }
    
    updateLeftPanel();
    radios.forEach(r => r.addEventListener('change', updateLeftPanel));
  });
</script>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    flatpickr("#date", {
      minDate: "today",
      disableMobile: "true", // ensures the custom UI is used on mobile instead of native
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "Y년 m월 d일",
      placeholder: "예약 날짜를 선택해주세요"
    });
  });
</script>
<script type="module" src="js/reservation.js"></script>
</body>
</html>
