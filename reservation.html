          <label class="tour-option">
            <input type="radio" name="tourType" value="R" required>

      <!-- Contact Info -->

      </div>

<!-- Dynamic Text and Reservation Script -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const requestedTour = urlParams.get('tour');
    const tourParam = urlParams.get('tour'); // for routing logic
    
    // Inclusions data
    const inclusionsData = {
      en: {
        'F': '<b>[Fast Track Inclusions]</b><br>Admission, viewing, environmental fee, round-trip vehicle all included<br>Free rental of life jacket, luggage storage, fins, and bottled water provided<br>Fast Track (minimal wait for Whale Shark)<br>Hotel drop-off after Whale Shark tour<br>Whale Shark underwater photography included<br>One free shrimp per person when using Jumbo Crab<br>Free Island Tour worth $30 per person',
        'VF': '<b>[VIP Fast Track Inclusions]</b><br>Admission, viewing, environmental fee, <b>Exclusive private vehicle</b> all included<br>Free rental of life jacket, luggage storage, fins, snorkel mask, and bottled water<br>Fast Track (minimal wait for Whale Shark)<br>Hotel drop-off after Whale Shark tour<br><b>Libertad Professional Underwater Photographer Service</b><br>One free shrimp per person when using Jumbo Crab<br>Free Island Tour worth $30 per person',
        'R': '<b>[Regular Tour Inclusions]</b><br>Guide and fins included<br>※ General admission tickets are used',
        'T': '<b>[Ticket Only Info]</b><br>Exclusive sale of admission tickets only (1,920PHP)<br>Ticket pickup: Official Boracay Whale Shark Office<br>Available time: 8:00 AM ~ 6:00 PM'
      },
      ko: {
        'F': '<b>[Fast Track 포함사항]</b><br>입장료, 관람료, 환경보호세, 왕복 차량 모두 포함<br>구명조끼, 짐 보관, 오리발, 생수 무료 제공<br>Fast Track (고래상어 대기 최소화)<br>고래상어 투어 후 호텔 샌딩<br>고래상어 수중 촬영 포함<br>점보크랩 이용 시 1인당 새우 1마리 무료<br>1인당 $30 상당 무료 아일랜드 투어',
        'VF': '<b>[VIP Fast Track 포함사항]</b><br>입장료, 관람료, 환경보호세, <b>전용 프라이빗 차량</b> 모두 포함<br>구명조끼, 짐 보관, 오리발, 스노클마스크, 생수 무료 제공<br>Fast Track (고래상어 대기 최소화)<br>고래상어 투어 후 호텔 샌딩<br><b>리버타드 전문 수중 사진작가 서비스</b><br>점보크랩 이용 시 1인당 새우 1마리 무료<br>1인당 $30 상당 무료 아일랜드 투어',
        'R': '<b>[Regular 투어 포함사항]</b><br>가이드 및 오리발 포함<br>※ 일반 입장권 사용',
        'T': '<b>[티켓 단독 안내]</b><br>입장권만 단독 판매 (1,920PHP)<br>티켓 수령: 보라카이 고래상어 공식 사무소<br>운영 시간: 오전 8:00 ~ 오후 6:00'
      }
    };

    const radios = document.querySelectorAll('input[name="tourType"]');
    const inclusionsPanel = document.getElementById('tour-inclusions');

    function updateInclusions() {
      const selectedValue = document.querySelector('input[name="tourType"]:checked').value;
      const lang = (typeof currentLang !== 'undefined') ? currentLang : 'en';
      const data = inclusionsData[lang];
      if (data[selectedValue]) {
        inclusionsPanel.innerHTML = data[selectedValue];
        inclusionsPanel.style.display = 'block';
      } else {
        inclusionsPanel.style.display = 'none';
      }
    }

    if (requestedTour) {
      const radio = document.querySelector(`input[name="tourType"][value="${requestedTour}"]`);
      if (radio) radio.checked = true;
    }
    
    // Update inclusions on initial load
    updateInclusions();

    // Update inclusions on radio button change
    radios.forEach(r => r.addEventListener('change', updateInclusions));

    const badge = document.getElementById('dyn-badge');
    const title = document.getElementById('dyn-title');
    const desc = document.getElementById('dyn-desc');
    const btn = document.getElementById('submit-btn');
    
    // Dynamically update left panel
    const leftPanelDesc = {
      en: {
        VF: 'A perfect premium tour with an exclusive private vehicle and underwater photographer.',
        F: 'The most popular All-inclusive package. Enjoy comfortably with minimal wait time.',
        R: 'A whale shark tour that stays true to the basics.',
        T: 'Simply pick up your admission ticket at the official Boracay Whale Shark office.'
      },
      ko: {
        VF: '전용 차량과 수중 사진작가가 포함된 완벽한 프리미엄 투어입니다.',
        F: '가장 인기 있는 올인클루시브 패키지. 최소 대기시간으로 편안하게 즐기세요.',
        R: '고래상어 투어의 기본에 충실한 상품입니다.',
        T: '보라카이 고래상어 공식 사무소에서 입장권만 간편하게 수령하세요.'
      }
    };

    function updateLeftPanel() {
      const val = document.querySelector('input[name="tourType"]:checked').value;
      const lang = (typeof currentLang !== 'undefined') ? currentLang : 'en';
      const d = leftPanelDesc[lang];
      if (val === 'VF') {
        title.innerHTML = 'VIP FAST<br>TRACK';
        desc.innerHTML = d.VF;
        btn.style.background = 'var(--color-primary)';
      } else if (val === 'F') {
        title.innerHTML = 'FAST<br>TRACK';
        desc.innerHTML = d.F;
        btn.style.background = 'var(--color-accent)';
      } else if (val === 'R') {
        title.innerHTML = 'REGULAR<br>TOUR';
        desc.innerHTML = d.R;
        btn.style.background = 'var(--color-fg)';
      } else if (val === 'T') {
        title.innerHTML = 'TICKET<br>ONLY';
        desc.innerHTML = d.T;
        btn.style.background = 'transparent';
        btn.style.color = 'var(--color-fg)';
        btn.style.border = '2px solid var(--color-fg)';
      }
    }
    
    updateLeftPanel();
    radios.forEach(r => r.addEventListener('change', updateLeftPanel));

    // Expose so the language toggle (defined in a later, separate script) can re-render on switch
    window.updateInclusions = updateInclusions;
    window.updateLeftPanel = updateLeftPanel;
  });
</script>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    flatpickr("#date", {
      minDate: "today",

      dateFormat: "Y-m-d",

      altFormat: "F j, Y",
      placeholder: "Please select a date"

</script>
<script>
  // ── Language Toggle ──
  const TEXTS = {
    en: {
      title: 'Book Your Tour',
      subtitle: 'Book easily and meet the miracle of Boracay.',
      labelDate: 'Desired Tour Date *',
      labelPeople: 'Number of People *',
      labelName: 'Name (English) *',
      labelEmail: 'Email *',
      placeholderName: 'HONG GILDONG',
      placeholderEmail: 'Enter your email address',
      btnSubmit: 'Proceed to Payment',
      btnLang: '🇰🇷 한국어',
    },
    ko: {
      title: '투어 예약하기',
      subtitle: '간편하게 예약하고 보라카이의 기적을 만나보세요.',
      labelDate: '투어 희망 날짜 *',
      labelPeople: '참여 인원 *',
      labelName: '예약자 성함 (영문) *',
      labelEmail: '이메일 *',
      placeholderName: '홍길동',
      placeholderEmail: '이메일 주소를 입력해주세요',
      btnSubmit: '결제하기',
      btnLang: '🇺🇸 English',
    }
  };
  let currentLang = 'en';

  function toggleLang() {
    currentLang = currentLang === 'en' ? 'ko' : 'en';
    applyLang(currentLang);
  }

  function applyLang(lang) {
    const t = TEXTS[lang];
    document.querySelector('.res-hero-title') && (document.querySelector('.res-hero-title').textContent = t.title);
    document.querySelector('.res-hero-subtitle') && (document.querySelector('.res-hero-subtitle').textContent = t.subtitle);
    const labels = document.querySelectorAll('label');
    const inputs = document.querySelectorAll('input');
    // Labels
    document.querySelector('label[for="date"]') && (document.querySelector('label[for="date"]').textContent = t.labelDate);
    document.querySelector('label[for="people"]') && (document.querySelector('label[for="people"]').textContent = t.labelPeople);
    document.querySelector('label[for="name"]') && (document.querySelector('label[for="name"]').textContent = t.labelName);
    document.querySelector('label[for="email"]') && (document.querySelector('label[for="email"]').textContent = t.labelEmail);
    // Placeholders
    document.getElementById('name') && (document.getElementById('name').placeholder = t.placeholderName);
    document.getElementById('email') && (document.getElementById('email').placeholder = t.placeholderEmail);
    // Submit button
    document.getElementById('submit-btn') && (document.getElementById('submit-btn').textContent = t.btnSubmit);
    // Lang button
    document.getElementById('lang-btn') && (document.getElementById('lang-btn').textContent = t.btnLang);
    // html lang
    document.documentElement.lang = lang;
    // Re-render tour-dependent dynamic content in the new language
    window.updateInclusions && window.updateInclusions();
    window.updateLeftPanel && window.updateLeftPanel();
  }

  // Auto-apply language from sessionStorage (set when clicking 한국어로 예약 on homepage)
  document.addEventListener('DOMContentLoaded', () => {
    const saved = sessionStorage.getItem('lang');
    if (saved === 'ko') {
      currentLang = 'ko';
      applyLang('ko');
      sessionStorage.removeItem('lang');
    }
  });
</script>
