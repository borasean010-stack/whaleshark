<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Now | BORACAY WHALE SHARK</title>
<link rel="stylesheet" href="css/style.css"> <!-- for nav -->
<link rel="stylesheet" href="css/reservation.css">
<!-- Flatpickr (Premium Datepicker) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
</head>
<body>


<!-- Header / Nav -->
<header class="site-header" style="position:fixed; width:100%; z-index:50;">
  <div class="container header-inner">
    <a href="index.html" class="logo">🐋 BORACAY WHALE SHARK</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="index.html#tours">Tours</a>
      <button id="lang-btn" onclick="toggleLang()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color:#fff; padding: 6px 16px; border-radius:99px; font-size:0.85rem; font-weight:700; cursor:pointer; transition:all 0.2s;">🇰🇷 한국어</button>
      <a href="reservation.html">Book Now</a>
    </nav>
  </div>
</header>

<!-- Background Video -->
<iframe class="res-bg-video" src="https://www.youtube.com/embed/GnC-jWDaqgY?autoplay=1&mute=1&loop=1&playlist=GnC-jWDaqgY&controls=0&showinfo=0&rel=0&playsinline=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<!-- Overlay -->
<div class="res-overlay"></div>

<!-- Split Layout -->
<div class="res-container">
  
  <!-- Left Column: Branding & Text (Dynamic Content) -->
  <div class="res-text-col">
    <span class="res-badge" id="dyn-badge">RESERVATION EXPERIENCE</span>
    <h1 class="res-title" id="dyn-title">SECURE<br>YOUR TOUR</h1>
    <p class="res-desc" id="dyn-desc">
      Book your private Boracay Whale Shark tour right now.
    </p>
  </div>

  <!-- Right Column: Booking Card (Form) -->
  <div class="booking-card">
    <form id="reservation-form">
      
      <!-- Tour Options Selection (Hidden as requested) -->
      <div class="form-group" style="display: none;">
        <label>Select Tour Option *</label>
        <div class="tour-options">
          <label class="tour-option">
            <input type="radio" name="tourType" value="F" checked required>
            <div class="tour-card">
              <h4>Fast Track</h4>
              <span>3,800PHP<br><small>All-inclusive + Fast Track</small></span>
            </div>
          </label>
          <label class="tour-option">
            <input type="radio" name="tourType" value="VF" required>
            <div class="tour-card">
              <h4>VIPFast Track</h4>
              <span>5,820PHP<br><small>Private vehicle + Photographer</small></span>
            </div>
          </label>
          <label class="tour-option">
            <input type="radio" name="tourType" value="R" required>
            <div class="tour-card">
              <h4>Regular Tour</h4>
              <span>2,820PHP<br><small>Basics included</small></span>
            </div>
          </label>
          <label class="tour-option">
            <input type="radio" name="tourType" value="T" required>
            <div class="tour-card">
              <h4>Ticket Only</h4>
              <span>1,920PHP<br><small>Purchase ticket only</small></span>
            </div>
          </label>
        </div>
        
        <!-- Inclusions Info Panel -->
        <div id="tour-inclusions" style="margin-top: 16px; padding: 16px; background: rgba(37, 99, 235, 0.05); border: 1px solid rgba(37, 99, 235, 0.2); border-radius: 12px; font-size: 0.9rem; line-height: 1.6; color: var(--color-fg); display: none;">
          <!-- Content filled by JS -->
        </div>
      </div>

      <!-- Date Selection -->
      <div class="form-group">
        <label for="date">Desired Tour Date *</label>
        <input type="date" id="date" name="date" class="input-luxury" required>
      </div>

      <!-- Guests -->
      <div class="form-group">
        <label for="people">Number of People *</label>
        <input type="number" id="people" name="people" class="input-luxury" min="1" max="20" value="2" required>
      </div>

      <!-- Contact Info -->
      <div class="form-group">
        <label for="name">Name (English) *</label>
        <input type="text" id="name" name="name" class="input-luxury" placeholder="HONG GILDONG" required>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" class="input-luxury" placeholder="Enter your email address" required>
      </div>



      <button type="submit" class="btn-submit" id="submit-btn">Proceed to Payment</button>
      
      <p id="form-status" class="form-status" role="status"></p>
    </form>
  </div>

</div>

<!-- Dynamic Text and Reservation Script -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const requestedTour = urlParams.get('tour');
    const tourParam = urlParams.get('tour'); // for routing logic
    
    // Inclusions data
    const inclusionsData = {
      'F': '<b>[Fast Track Inclusions]</b><br>Admission, viewing, environmental fee, round-trip vehicle all included<br>Free rental of life jacket, luggage storage, fins, and bottled water provided<br>Fast Track (minimal wait for Whale Shark)<br>Hotel drop-off after Whale Shark tour<br>Whale Shark underwater photography included<br>One free shrimp per person when using Jumbo Crab<br>Free Island Tour worth $30 per person',
      'VF': '<b>[VIP Fast Track Inclusions]</b><br>Admission, viewing, environmental fee, <b>Exclusive private vehicle</b> all included<br>Free rental of life jacket, luggage storage, fins, snorkel mask, and bottled water<br>Fast Track (minimal wait for Whale Shark)<br>Hotel drop-off after Whale Shark tour<br><b>Libertad Professional Underwater Photographer Service</b><br>One free shrimp per person when using Jumbo Crab<br>Free Island Tour worth $30 per person',
      'R': '<b>[Regular Tour Inclusions]</b><br>Guide and fins included<br>※ General admission tickets are used',
      'T': '<b>[Ticket Only Info]</b><br>Exclusive sale of admission tickets only (1,920PHP)<br>Ticket pickup: Official Boracay Whale Shark Office<br>Available time: 8:00 AM ~ 6:00 PM'
    };

    const radios = document.querySelectorAll('input[name="tourType"]');
    const inclusionsPanel = document.getElementById('tour-inclusions');

    function updateInclusions() {
      const selectedValue = document.querySelector('input[name="tourType"]:checked').value;
      if (inclusionsData[selectedValue]) {
        inclusionsPanel.innerHTML = inclusionsData[selectedValue];
        inclusionsPanel.style.display = 'block';
      } else {
        inclusionsPanel.style.display = 'none';
      }
    }

    if (requestedTour) {
      const radio = document.querySelector(`input[name="tourType"][value="${requestedTour}"]`);
      if (radio) radio.checked = true;
    }
    
    // Update inclusions on initial load
    updateInclusions();

    // Update inclusions on radio button change
    radios.forEach(r => r.addEventListener('change', updateInclusions));

    const badge = document.getElementById('dyn-badge');
    const title = document.getElementById('dyn-title');
    const desc = document.getElementById('dyn-desc');
    const btn = document.getElementById('submit-btn');
    
    // Dynamically update left panel
    function updateLeftPanel() {
      const val = document.querySelector('input[name="tourType"]:checked').value;
      if (val === 'VF') {
        title.innerHTML = 'VIP FAST<br>TRACK';
        desc.innerHTML = 'A perfect premium tour with an exclusive private vehicle and underwater photographer.';
        btn.style.background = 'var(--color-primary)';
      } else if (val === 'F') {
        title.innerHTML = 'FAST<br>TRACK';
        desc.innerHTML = 'The most popular All-inclusive package. Enjoy comfortably with minimal wait time.';
        btn.style.background = 'var(--color-accent)';
      } else if (val === 'R') {
        title.innerHTML = 'REGULAR<br>TOUR';
        desc.innerHTML = 'A whale shark tour that stays true to the basics.';
        btn.style.background = 'var(--color-fg)';
      } else if (val === 'T') {
        title.innerHTML = 'TICKET<br>ONLY';
        desc.innerHTML = 'Simply pick up your admission ticket at the official Boracay Whale Shark office.';
        btn.style.background = 'transparent';
        btn.style.color = 'var(--color-fg)';
        btn.style.border = '2px solid var(--color-fg)';
      }
    }
    
    updateLeftPanel();
    radios.forEach(r => r.addEventListener('change', updateLeftPanel));
  });
</script>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    flatpickr("#date", {
      minDate: "today",
      disableMobile: "true",
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "F j, Y",
      placeholder: "Please select a date"
    });
  });
</script>
<script>
  // ── Language Toggle ──
  const TEXTS = {
    en: {
      title: 'Book Your Tour',
      subtitle: 'Book easily and meet the miracle of Boracay.',
      labelDate: 'Desired Tour Date *',
      labelPeople: 'Number of People *',
      labelName: 'Name (English) *',
      labelEmail: 'Email *',
      placeholderName: 'HONG GILDONG',
      placeholderEmail: 'Enter your email address',
      btnSubmit: 'Proceed to Payment',
      btnLang: '🇰🇷 한국어',
    },
    ko: {
      title: '투어 예약하기',
      subtitle: '간편하게 예약하고 보라카이의 기적을 만나보세요.',
      labelDate: '투어 희망 날짜 *',
      labelPeople: '참여 인원 *',
      labelName: '예약자 성함 (영문) *',
      labelEmail: '이메일 *',
      placeholderName: '홍길동',
      placeholderEmail: '이메일 주소를 입력해주세요',
      btnSubmit: '결제하기',
      btnLang: '🇺🇸 English',
    }
  };
  let currentLang = 'en';

  function toggleLang() {
    currentLang = currentLang === 'en' ? 'ko' : 'en';
    applyLang(currentLang);
  }

  function applyLang(lang) {
    const t = TEXTS[lang];
    document.querySelector('.res-hero-title') && (document.querySelector('.res-hero-title').textContent = t.title);
    document.querySelector('.res-hero-subtitle') && (document.querySelector('.res-hero-subtitle').textContent = t.subtitle);
    const labels = document.querySelectorAll('label');
    const inputs = document.querySelectorAll('input');
    // Labels
    document.querySelector('label[for="date"]') && (document.querySelector('label[for="date"]').textContent = t.labelDate);
    document.querySelector('label[for="people"]') && (document.querySelector('label[for="people"]').textContent = t.labelPeople);
    document.querySelector('label[for="name"]') && (document.querySelector('label[for="name"]').textContent = t.labelName);
    document.querySelector('label[for="email"]') && (document.querySelector('label[for="email"]').textContent = t.labelEmail);
    // Placeholders
    document.getElementById('name') && (document.getElementById('name').placeholder = t.placeholderName);
    document.getElementById('email') && (document.getElementById('email').placeholder = t.placeholderEmail);
    // Submit button
    document.getElementById('submit-btn') && (document.getElementById('submit-btn').textContent = t.btnSubmit);
    // Lang button
    document.getElementById('lang-btn') && (document.getElementById('lang-btn').textContent = t.btnLang);
    // html lang
    document.documentElement.lang = lang;
  }

  // Auto-apply language from sessionStorage (set when clicking 한국어로 예약 on homepage)
  document.addEventListener('DOMContentLoaded', () => {
    const saved = sessionStorage.getItem('lang');
    if (saved === 'ko') {
      currentLang = 'ko';
      applyLang('ko');
      sessionStorage.removeItem('lang');
    }
  });
</script>
<script type="module" src="js/reservation.js?v=20260813-1"></script>
</body>
</html>
