name: Sync to Cho Fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Cho fork via token
        run: |
          git remote add fork https://${{ secrets.FORK_SYNC_TOKEN }}@github.com/choheejung1979/whaleshark.git
          git fetch fork || true
          git push fork HEAD:main --force
