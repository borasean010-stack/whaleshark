name: Sync to Cho Fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cho fork
        uses: actions/checkout@v4
        with:
          repository: choheejung1979/whaleshark
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Add original repository
        run: |
          git remote add upstream https://github.com/borasean010-stack/whaleshark.git
          git fetch upstream main

      - name: Merge latest original changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit

      - name: Push to Cho fork
        run: |
          git push origin main --force
