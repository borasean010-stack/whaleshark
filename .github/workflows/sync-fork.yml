name: Sync to Cho Fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Push to Cho fork via token
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote add fork https://${{ secrets.FORK_SYNC_TOKEN }}@github.com/choheejung1979/whaleshark.git
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan deploy
          git rm -rf --cached .github
          rm -rf .github
          
          git commit -m "Auto-deploy: sync latest changes"
          git push fork deploy:main --force
